# relayd(8) equivalent of nginx.conf: TLS-terminating HTTP relay for
# arkgate. Deployed the same way nginx.conf currently is (see
# setup_arkgate.sh) -- but relayd itself cannot serve static files
# (there's no root/index/try_files equivalent), so "/" is forwarded to
# a local httpd(8) instance serving /var/www/html instead. See the
# companion httpd.conf.
#
# TLSv1.2/1.3-only and disabled TLS session tickets are relayd's
# compiled-in defaults (sslv3/tlsv1.0/tlsv1.1 support has been removed
# entirely, and session tickets default off), so unlike nginx.conf's
# explicit ssl_protocols/ssl_session_tickets settings, no directives
# are needed here to get the same behavior.
#
# `tls keypair name` takes NO cert/key path arguments on this relayd
# version -- it only ever looks in fixed locations: a private key at
# /etc/ssl/private/name[:port].key and a cert at /etc/ssl/name[:port].crt,
# falling back to the same without ":port" if the ported name isn't
# found. setup_arkgate.sh generates the keypair at
# /etc/ssl/arkgate.local.crt / /etc/ssl/private/arkgate.local.key to
# match.
#
# Gap: there is no relayd equivalent of nginx's client_max_body_size.
# relayd relays the request stream without buffering or limiting body
# size, so if that protection still matters it has to be enforced by
# the backend application itself.
#
# VALIDATED end-to-end on a real OpenBSD 7.9/amd64 host
# (192.168.188.128): `relayd -n` reports "configuration OK", and with
# relayd/httpd actually running plus mock backends on 44444/8000, real
# HTTPS requests through this relay to /, /api/*, and /ui/* all
# reached the right backend. Earlier drafts of this file used
# `tls keypair NAME cert "path" key "path"` and `listen on egress`,
# both real syntax errors on this relayd version -- fixed below.
#
# Also found while testing: this relayd build FAILS to load an EC
# (prime256v1) private key ("ssl_load_pkey: failed to extract RSA"),
# even though libtls itself supports EC keys and nginx had no problem
# with the same key. An RSA keypair loads and works fine, which is why
# setup_arkgate.sh generates an RSA keypair for relayd (nginx's old EC
# keypair generation is gone now that nginx is gone) and why the
# cipher list below is the RSA cert variant (ECDHE-RSA-*), not
# ECDHE-ECDSA-* as an EC cert would need.

table <www> { 127.0.0.1 }
table <api> { 127.0.0.1 }
table <ui>  { 127.0.0.1 }

http protocol "arkgate_tls" {
	tls keypair "arkgate.local"
	tls ciphers "ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305"

	# equivalent of nginx's proxy_set_header X-Real-IP / X-Forwarded-For
	match request header set "X-Real-IP" value "$REMOTE_ADDR"
	match request header append "X-Forwarded-For" value "$REMOTE_ADDR"

	# equivalent of nginx's add_header ... always (security headers)
	match response header set "Strict-Transport-Security" value "max-age=63072000"
	match response header set "X-Content-Type-Options" value "nosniff"
	match response header set "X-Frame-Options" value "DENY"
	match response header set "Referrer-Policy" value "no-referrer"

	# equivalent of nginx's location /api and location /ui blocks.
	# "quick" stops rule evaluation so a match here doesn't also fall
	# through to the catch-all "pass" below.
	pass request quick path "/api/*" forward to <api>
	pass request quick path "/ui/*" forward to <ui>

	# equivalent of nginx's location / (static files, served by httpd(8))
	pass
}

relay "arkgate_https" {
	# relayd has no "listen on all interfaces" keyword (unlike pf's
	# "egress"); 0.0.0.0 / :: are the explicit IPv4-any/IPv6-any
	# equivalents of nginx's "listen 8443 ssl;" / "listen [::]:8443 ssl;"
	listen on 0.0.0.0 port 8443 tls
	listen on :: port 8443 tls
	protocol "arkgate_tls"
	forward to <www> port 8080 check tcp
	forward to <api> port 44444 check tcp
	forward to <ui> port 8000 check tcp
}
