# httpd(8) companion to relayd.conf: serves the static content that
# nginx.conf's "root /var/www/html; location / { try_files $uri $uri/
# =404; }" used to serve directly. relayd has no static file serving
# of its own, so it forwards "/" requests here over loopback instead.
#
# httpd chroots to /var/www, so root "/html" below resolves to the
# same /var/www/html path nginx used.
#
# Gap: nginx's index list was "index.html index.htm
# index.nginx-debian.html" (first existing file wins); httpd(8) only
# takes a single index filename, so only index.html is covered here.
# The $uri/=404 fallback behavior nginx got from try_files is httpd's
# default behavior already -- serve the exact path if it exists, the
# directory's index if it's a directory, 404 otherwise -- so no
# explicit directive is needed for that part.
#
# NOT validated against a running httpd(8) -- see relayd.conf's header
# for why. Run `httpd -n -f httpd.conf` before trusting this.

server "arkgate-static" {
	listen on 127.0.0.1 port 8080
	root "/html"
	directory {
		index "index.html"
	}
}

server "arkgate.local" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
}
